<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeoPelago</title>
<style>
/* GeoPelago styles. Colour palette used everywhere: ink/slate = dark backgrounds, sea = teal borders, */
/* sand = light text and cards, flag = orange accent, bad = red (errors, locked), ok = green (connected). */
:root{--ink:#14202b;--slate:#1f3040;--sea:#2f6f7e;--sand:#efe6d2;--flag:#e8a33d;--bad:#d9604c;--ok:#5fb67a;font-family:Georgia,"Iowan Old Style",serif}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--ink);color:var(--sand)}
button,input{font:inherit}
/* Top bar: game title, connection status text and the Connect button. */
header{position:fixed;inset:0 0 auto 0;height:48px;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--slate);z-index:1000;border-bottom:2px solid var(--sea)}
h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.02em}
/* Small status pill next to the title (Offline / Connecting / Connected as ...). */
/* The GeoPelago title is a link back to the main page (its address is HOME_URL in the script). */
h1 a{color:inherit;text-decoration:none}
h1 a:hover{text-decoration:underline}
#status{font-size:13px;padding:3px 10px;border-radius:99px;background:#0003}
#status.on{color:var(--ok)}#status.err{color:var(--bad)}
.sp{flex:1}
/* GitHub logo button (top bar, left of Connect): same outlined look as .btn.alt, with the logo drawn in the text colour. */
.gh{display:inline-flex;align-items:center;justify-content:center;width:36px;height:34px;border:1px solid var(--sea);border-radius:4px;color:var(--sand);text-decoration:none}
.gh:hover{border-color:var(--flag);color:var(--flag)}
.gh svg{width:20px;height:20px;fill:currentColor}
/* Buttons. .btn is the orange main button, .btn.alt is the outlined secondary one. */
.btn{background:var(--flag);color:var(--ink);border:0;padding:7px 14px;border-radius:4px;font-weight:700;cursor:pointer}
.btn.alt{background:transparent;color:var(--sand);border:1px solid var(--sea)}
.btn:disabled{opacity:.4;cursor:not-allowed}
/* The play area under the top bar. Everything in the game is layered on top of the Street View (#pano). */
#view{position:fixed;inset:48px 0 0 0;background:#000}
#pano{position:absolute;inset:0}
/* Top-left corner: holds the Checks box and the compass side by side. */
#topleft{position:absolute;top:10px;left:10px;right:10px;z-index:900;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;pointer-events:none}
#topleft>*{pointer-events:auto}
/* Compass (hidden until the first round starts). */
#compass{display:none;width:92px;height:92px;flex:none;filter:drop-shadow(0 2px 6px #0008)}
/* Checks box: progress for each score bracket and the Correct Country checks. Hidden until connected. */
#hud{display:none;position:static;background:#14202bdd;border:1px solid var(--sea);padding:10px 12px;border-radius:6px;font-size:13px;min-width:210px}
/* Left column of the top-left area: the Checks box with the hint box underneath it. */
#leftcol{display:flex;flex-direction:column;gap:10px}
/* Hint box: shows what the super powers found this round. Hidden until a power is used. */
#hint{display:none;background:#14202bdd;border:1px solid var(--sea);padding:10px 12px;border-radius:6px;font-size:13px;min-width:210px}
#hint .h{margin:4px 0;line-height:1.35}
/* Super powers: the PP tab and four power buttons, to the right of the compass. Hidden until connected. */
#powers{display:none;gap:8px;align-items:flex-start}
#pts{background:#14202bdd;border:1px solid var(--sea);border-radius:6px;padding:10px 14px;font-size:15px;font-weight:700;white-space:nowrap}
#pts span{color:var(--flag)}
#pbtns{display:flex;gap:8px;flex-wrap:wrap}
.power{position:relative;width:56px;height:52px;padding:0;justify-content:center;background:#14202bdd;border:1px solid var(--sea);border-radius:6px;color:var(--sand);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-size:11px}
.power svg{width:28px;height:28px}
/* Point cost: a small badge on the button's top-right corner. It turns red while you cannot afford the power. */
.power .cost{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--flag);color:var(--ink);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px #0008}
.power.poor .cost{background:var(--bad);color:#fff}
.power:hover{border-color:var(--flag)}
.power.poor{opacity:.6}                                 /* not enough PP yet */
.power.idle{opacity:.4;cursor:not-allowed}              /* no round in progress */
.power.on{border-color:var(--flag);color:var(--flag);cursor:default}  /* already used this round */
/* Tool tip with the power's name, shown when hovering a button. */
.power::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--sand);color:var(--ink);padding:4px 9px;border-radius:4px;font-size:12px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .12s;z-index:5}
.power:hover::after{opacity:1}
/* Bottom-left corner: the Goal box and the text client sit side by side in this row. */
#bottomleft{position:absolute;left:12px;bottom:12px;z-index:900;display:flex;align-items:flex-end;gap:10px}
/* Text client: a scrolling log of Archipelago messages with a chat box underneath. Hidden until connected. */
#chat{display:none;flex-direction:column;width:clamp(240px,30vw,420px);height:230px;background:#14202bdd;border:1px solid var(--sea);border-radius:6px;font-size:13px}
#chat b{display:block;font-size:15px;padding:8px 12px 4px}
#chatLog{flex:1;min-height:0;overflow-y:auto;padding:0 12px 6px;line-height:1.45;word-break:break-word}
#chatLog div{margin:2px 0}
/* Bottom row of the text client: the collapse button in the bottom-left corner, then the message box. */
#chatBar{display:flex;border-top:1px solid var(--sea)}
#chatIn{flex:1;min-width:0;border:0;background:#0004;color:var(--sand);padding:8px 12px;border-radius:0 0 6px 0;outline:none;font:inherit}
.ctoggle{flex:none;width:36px;display:flex;align-items:center;justify-content:center;border:0;border-right:1px solid var(--sea);background:#0004;color:var(--sand);font-size:22px;line-height:1;cursor:pointer;border-radius:0 0 0 6px}
.ctoggle:hover{color:var(--flag)}
.ctoggle svg{width:20px;height:20px}
/* Collapsed: only the button (showing a notepad icon) is left, sitting in the same corner. */
#chat.min{width:auto;height:auto}
#chat.min b,#chat.min #chatLog,#chat.min #chatIn{display:none}
#chat.min #chatBar{border-top:0}
#chat.min .ctoggle{width:42px;height:42px;border:0;border-radius:6px}
/* Colours for parts of a message: progression, useful, trap and filler items; your name, other players, locations. */
.c-prog{color:var(--flag)}.c-useful{color:#6fc3d4}.c-trap{color:var(--bad)}.c-filler{color:#aab}
.c-me{color:var(--ok)}.c-pl{color:#e6d38a}.c-loc{color:#8fd0b0}
/* Goal box (bottom left): countries unlocked out of the number needed to win. Hidden until connected. */
#goal{display:none;background:#14202bdd;border:1px solid var(--sea);padding:14px 18px;border-radius:6px;font-size:18px;min-width:300px}
#goal b{display:block;font-size:22px;margin-bottom:8px}
#goal .bar{height:7px;margin-top:4px}
#hud b,#hint b{display:block;font-size:15px;margin-bottom:6px}
/* A progress row (label on the left, x/y on the right) and the thin progress bar under it. */
.row{display:flex;justify-content:space-between;gap:14px;line-height:1.6}
.bar{height:4px;background:#0006;border-radius:2px;margin-bottom:3px}.bar i{display:block;height:100%;background:var(--flag);border-radius:2px}
/* Guess map panel (bottom right). Small while looking around; grows while the mouse is over it (class .hov, which is
   removed 2 seconds after the mouse leaves) and after a guess (class .big). */
#gwrap{position:absolute;right:12px;bottom:12px;width:320px;height:230px;z-index:900;transition:width .18s,height .18s;border:2px solid var(--flag);border-radius:6px;background:var(--slate);display:none;flex-direction:column;overflow:hidden}
#gwrap.hov,#gwrap.big{width:min(680px,92vw);height:min(470px,70vh)}
#gmap{flex:1;min-height:0}
#guessBtn{border-radius:0;width:100%}
/* Score pop-up shown after a guess, centred on screen, with a dark overlay (#dim) behind it. */
#result{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:970;background:var(--sand);color:var(--ink);padding:30px 44px;border-radius:12px;display:none;width:min(520px,92vw);text-align:center;box-shadow:0 12px 50px #000a}
#result h2{margin:0 0 10px;font-size:56px;line-height:1}
#result p{margin:8px 0;font-size:20px;line-height:1.35}
#result .btn{font-size:20px;padding:12px 30px;margin-top:10px}
#dim{position:absolute;inset:0;background:rgba(10,18,26,.55);z-index:940;display:none}
#gwrap.big{z-index:960}
.chk{color:#1c6b3a;font-weight:700}
/* Connect dialog (server, slot name, password). */
#modal{position:fixed;inset:0;background:#000b;z-index:2000;display:flex;align-items:center;justify-content:center;padding:14px}
#modal.hide{display:none}
#panel{background:var(--slate);border:1px solid var(--sea);border-radius:8px;padding:20px;width:min(520px,100%);max-height:94vh;overflow:auto}
#panel h2{margin:0 0 10px}
label{display:block;font-size:13px;margin:10px 0 3px;color:#c9bf9f}
input[type=text],input[type=password]{width:100%;padding:8px;border:1px solid var(--sea);background:var(--ink);color:var(--sand);border-radius:4px}
small{color:#a9a68f;display:block;margin-top:4px;line-height:1.4}
#msg{margin-top:10px;color:var(--bad);min-height:18px;font-size:14px}
/* Pop-ups in the top right that show which item each check found. They fade after 10 seconds. */
#notes{position:fixed;top:58px;right:14px;z-index:3500;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.note{background:var(--sand);color:var(--ink);border-left:6px solid #999;padding:10px 16px;border-radius:6px;min-width:230px;max-width:340px;box-shadow:0 6px 20px #0007;transition:opacity .7s,transform .7s}
.note small{display:block;opacity:.7;font-size:12px}.note b{display:block;font-size:18px}.note span{font-size:13px}
.note.progression{border-color:var(--flag)}.note.useful{border-color:var(--sea)}.note.trap{border-color:var(--bad)}
.note.out{opacity:0;transform:translateX(20px)}
/* Short warning messages (for example 'This country is locked'). */
#toast{position:fixed;bottom:260px;right:14px;z-index:3000;background:var(--bad);color:#fff;padding:8px 14px;border-radius:4px;display:none;max-width:300px}
/* Full-screen 'Finding a location' cover shown while a round is being set up. */
/* Goal-complete pop-up: covers only the game area (the top bar stays usable) and blocks further play. */
#complete{position:absolute;inset:0;z-index:990;background:rgba(10,18,26,.9);display:none;align-items:center;justify-content:center;padding:20px}
#complete .card{background:var(--sand);color:var(--ink);border-radius:12px;padding:40px 52px;text-align:center;width:min(560px,92vw);box-shadow:0 12px 50px #000a}
#complete h2{font-size:54px;line-height:1;margin:0 0 14px}
#complete p{font-size:22px;line-height:1.35;margin:8px 0}
#loading{position:absolute;inset:0;z-index:850;background:var(--ink);display:none;align-items:center;justify-content:center;font-size:20px}
/* Start screen shown before the first round. */
#start{position:absolute;inset:0;z-index:850;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px}
#start h2{font-size:32px;margin:0}
code{background:#0004;padding:1px 5px;border-radius:3px;font-size:12px}
/* Phones and narrow windows: shrink the boxes and compass so everything still fits. */
@media(max-width:600px){.power{width:48px;height:46px}#pts{padding:8px 10px;font-size:13px}#chat{display:none!important}#goal{min-width:0;font-size:14px;padding:10px 12px}#goal b{font-size:17px}#hud{min-width:0;font-size:12px}#compass{width:64px;height:64px}#gwrap{width:200px;height:150px}}
</style>
</head>
<body>
<!-- Top bar with the title, connection status and Connect button. -->
<header>
  <h1><a id="homeLink" href="./">GeoPelago</a></h1>
  <span id="status">Offline</span>
  <span class="sp"></span>
  <!-- Link to the project's GitHub page (opens in a new tab). The icon is the GitHub logo drawn as an SVG. -->
  <a class="gh" href="https://github.com/JustZach-bot/GeoPelago" target="_blank" rel="noopener noreferrer" title="GeoPelago on GitHub" aria-label="GeoPelago on GitHub"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></a>
  <button class="btn alt" id="settingsBtn" style="color:var(--bad);border-color:var(--bad)">Connect</button>
</header>

<!-- Main play area. Layers, from back to front: Street View, top-left boxes, Goal box, guess map, -->
<!-- dark overlay, score pop-up, loading cover and start screen. -->
<div id="view">
  <div id="pano"></div>
<!-- Checks box (filled in by render()) and the compass (drawn by buildCompass()). -->
  <div id="topleft">
  <div id="leftcol">
    <div id="hud">
      <b id="roundLbl">Checks</b>
      <div id="prog"></div>
    </div>
    <!-- Hint box under the Checks box: filled in by usePower() with what the powers found this round. -->
    <div id="hint"><b>Hints</b><div id="hintBody"></div></div>
  </div>
  <div id="compass"><svg viewBox="-50 -50 100 100"><circle r="48" fill="#14202bdd" stroke="#2f6f7e" stroke-width="2"/><g id="dial"></g><path d="M0,-47 L-5,-37 L5,-37 Z" fill="#e8a33d"/><circle r="2.5" fill="#efe6d2"/></svg></div>
  <!-- Super powers, to the right of the compass: the PP tab, then one button per power (built by buildPowers()). -->
  <div id="powers"><div id="pts">PP: <span id="ptsN">0</span></div><div id="pbtns"></div></div>
  </div>
<!-- Goal box: filled in by render() with the countries-unlocked progress. -->
  <div id="bottomleft">
    <div id="goal"><b>Goal</b><div id="goalBody"></div></div>
    <!-- Text client: shows the multiworld's messages (chat, items sent, hints, joins). Type here to chat or use commands like !hint. -->
    <div id="chat"><b>Text Client</b><div id="chatLog"></div>
      <!-- Bottom row: collapse button (shows a minus when open, a notepad icon when collapsed) and the message box. -->
      <div id="chatBar"><button id="chatToggle" class="ctoggle" type="button" title="Collapse text client" aria-label="Collapse text client">&minus;</button><input id="chatIn" type="text" placeholder="Type a message or !command" maxlength="500" autocomplete="off"></div>
    </div>
  </div>
<!-- Guess map (Google Map) plus the button that submits the guess. -->
  <div id="gwrap"><div id="gmap"></div><button class="btn" id="guessBtn" disabled>Place a guess</button></div>
<!-- Dark overlay and score pop-up, both shown by submit() and hidden by newRound(). -->
  <div id="dim"></div>
  <div id="result"></div>
<!-- Cover shown while a round loads. -->
  <div id="loading">Finding a location…</div>
<!-- Goal-complete pop-up. Shown by checkGoal() once enough countries are unlocked. It sits inside the play area, so the top bar stays clickable. -->
  <div id="complete"><div class="card"><h2>Goal complete!</h2><p id="completeMsg"></p><p>You have unlocked everything you needed. Thanks for playing!</p></div></div>
  <!-- Start screen. The button runs begin(). -->
  <div id="start">
    <h2>Where in the world is your next check?</h2>
    <div><button class="btn" id="startBtn">Start playing</button></div>
  </div>
</div>
<!-- Toast = a short message. Notes = the item pop-ups in the top right. -->
<div id="toast"></div>
<div id="notes"></div>

<!-- Connect dialog. The Connect button runs connect(). The game name and Google key are set in the script below. -->
<div id="modal">
 <div id="panel">
  <h2>Connect to Archipelago</h2>
  <label>Server</label><input type="text" id="server" placeholder="archipelago.gg:38281">
  <label>Slot name</label><input type="text" id="slot">
  <label>Password (optional)</label><input type="password" id="pw">
  <p style="display:flex;gap:8px;margin-top:14px"><button class="btn" id="connectBtn">Connect</button><button class="btn alt" id="closeBtn">Close</button></p>
  <div id="msg"></div>
 </div>
</div>

<!-- Everything below is the game logic. Sections: Data, State, Helpers, Archipelago client, HUD, Geo (maps), -->
<!-- Rounds (picking locations, scoring) and Boot (start-up). -->
<script>
// COUNTRY DATA
// Every country is one entry: two-letter code (cc, used by Google/OpenStreetMap), three-letter code (iso3, used by the
// border data), name, and a rough latitude,longitude used as a fallback position for its lock icon.
// The names here must match the item names in the GeoPelago APWorld exactly.

// ARCHIPELAGO CLIENT
// Talks to the multiworld server over a WebSocket. Order of events:
// RoomInfo -> we ask for the game's data package (item and location names) -> we send Connect -> server answers
// Connected (our checked locations, slot data) -> ReceivedItems arrive (unlocked countries).
// ---------- Archipelago client ----------
// Open the WebSocket to the server typed in the dialog and start the handshake.
function connect(){
  const c=cfg();save({...c,pw:''});
  if(!c.server||!c.slot){$('#msg').textContent='Server, slot and game are required.';return}
  let url=c.server;if(!/^wss?:\/\//.test(url))url='wss://'+url;
  $('#msg').textContent='';setStatus('Connecting…');S.dp={};S.connectSent=false;
  if(S.ws)try{S.ws.close()}catch(e){}
  let ws;try{ws=new WebSocket(url)}catch(e){fail('Bad server address');return}
  S.ws=ws;
  ws.onmessage=e=>JSON.parse(e.data).forEach(m=>handle(m,c));
  ws.onerror=()=>fail('Could not reach the server. If wss:// fails, try ws://host:port.');
  ws.onclose=()=>{if(S.online){S.online=false;setStatus('Disconnected','err')}};
}
// Send one Archipelago command to the server (if the socket is open).
const send=m=>{if(S.ws&&S.ws.readyState===1)S.ws.send(JSON.stringify([m]))};
// Go offline and show an error in the Connect dialog.
function fail(t){S.online=false;setStatus('Offline','err');$('#msg').textContent=t;$('#modal').classList.remove('hide')}
// Handle each message from the server. The switch below has one case per message type we care about.
function handle(m,c){
  switch(m.cmd){
    // Server greeting: ask for the data package of our game.
    case 'RoomInfo': send({cmd:'GetDataPackage',games:[GAME_NAME]});break;
    // Item/location name tables arrived. The first one is ours, so build the ID lookups and send Connect.
    // Later ones (other players' games) are only stored so we can name the items those players hold.
    case 'DataPackage':{
      Object.assign(S.dp,m.data.games);
      if(S.connectSent)break; // extra packages requested after connecting
      const g=S.dp[GAME_NAME];
      if(!g){fail(`Game "${GAME_NAME}" not found on this server.`);return}
      S.items={};for(const[n,i]of Object.entries(g.item_name_to_id))S.items[i]=n;
      S.loc=g.location_name_to_id;S.locName={};for(const[n,i]of Object.entries(S.loc))S.locName[i]=n;
      S.connectSent=true;
      send({cmd:'Connect',password:c.pw,game:GAME_NAME,name:c.slot,uuid:Math.random().toString(36).slice(2)+Date.now(),version:{major:0,minor:5,build:1,class:'Version'},items_handling:7,tags:[],slot_data:true});
      break}
    // Login worked. Read our slot info, which checks are already done, the country pool and the goal from slot data,
    // count how many checks exist in each group, then show the Checks and Goal boxes.
    case 'Connected':{
      S.slot=m.slot;S.slots=m.slot_info||{};S.players=m.players||[];
      // Fetch item names for the other games so we can show what each check found.
      const more=[...new Set(Object.values(S.slots).map(x=>x.game))].filter(g=>g&&!S.dp[g]);
      if(more.length)send({cmd:'GetDataPackage',games:more});
      S.complete=false;$('#complete').style.display='none'; // new login: clear any earlier finish
      $('#chatLog').innerHTML='';                            // and the old text client log
      try{S.spent=parseInt(localStorage.getItem(spentKey()))||0}catch(e){S.spent=0} // PP already spent for this slot
      S.used.clear();S.hints=[];renderHints();
      S.online=true;S.goalSent=false;S.checked=new Set(m.checked_locations||[]);S.unlocked.clear();
      // Slot data from the APWorld: the country pool and how many countries finish the game.
      const sd=m.slot_data||{},sc=sd.countries;
      S.pool=Array.isArray(sc)?new Set(sc.map(n=>NAME2CC.get(String(n).toLowerCase())).filter(Boolean)):null;
      S.required=Math.max(0,parseInt(sd.countries_required)||0);
      S.gated=new Set(Array.isArray(sd.gated_categories)?sd.gated_categories:[]); // groups that need an unlock item
      S.gates=new Set(); // unlock items received so far (filled by ReceivedItems)
      // Count the active checks in each group straight from this slot's location list.
      S.catOf={};S.totals={};
      [...(m.checked_locations||[]),...(m.missing_locations||[])].forEach(id=>{
        const n=S.locName[id]||'',x=/^Points (\S+) #\d+$/.exec(n);
        const k=x?x[1]:/^Correct Country #\d+$/.test(n)?'country':null;
        if(k){S.catOf[id]=k;S.totals[k]=(S.totals[k]||0)+1}});

    // Wrong slot name, password or game: show why.
    case 'ConnectionRefused': fail('Refused: '+(m.errors||[]).join(', '));break;
    // Items sent to us. Country items unlock that country on the map (a trailing ' Unlock', ' Key' or ' Pass' is ignored; the space matters, otherwise 'Turkey' would lose its 'key').
    case 'ReceivedItems':
      if(m.index===0){S.unlocked.clear();S.gates.clear()}
      m.items.forEach(it=>{const n=(S.items[it.item]||'').replace(/\s+(unlock|key|pass)$/i,'').toLowerCase();

    case 'PrintJSON': chatLine(m.data||[]);break;

    const game=(S.slots[x.player]||{}).game,f=x.flags||0;

// If enough countries are unlocked: tell the server the goal is complete (status 30 = goal), then show the
// 'Goal complete' pop-up over the game area and stop all further play (S.complete is checked by every round function).
function checkGoal(){
  if(!S.online||S.complete)return;
  const pool=S.pool?[...S.pool]:COUNTRIES.map(c=>c.cc);
  const have=pool.filter(cc=>S.unlocked.has(cc)).length,need=S.required||pool.length;
  if(need>0&&have>=need){
    S.complete=true;S.goalSent=true;
    send({cmd:'StatusUpdate',status:30});           // tell the server the goal is complete
    $('#completeMsg').textContent=`You unlocked ${have} of the ${need} countries you needed.`;
    $('#complete').style.display='flex';            // block the game area; no more rounds
  }
}

// Ask OpenStreetMap (Nominatim) which country a point is in. Limited to one request per 1.1 seconds, 5 second timeout.
async function reverse(lat,lng){
  const wait=S.lastRev+1100-Date.now();if(wait>0)await new Promise(r=>setTimeout(r,wait));
  S.lastRev=Date.now();
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=3&accept-language=en&lat=${lat}&lon=${lng}`,{signal:AbortSignal.timeout(5000)});
    const j=await r.json();
    if(j.address&&j.address.country_code)return{cc:j.address.country_code,name:j.address.country};
  }catch(e){}
  return null;
}
// gm = guess map, gMarker = your guess pin, aMarker = the real spot, gLine = line between them,
// svs/pano = Street View service and viewer, locks = one lock icon per country.
let gm,gMarker,gLine,aMarker,svs,pano;const locks={};
// Country border shapes (Natural Earth, loaded from the internet; the second is a smaller backup).
const GEO_URLS=['https://cdn.jsdelivr.net/gh/nvkelso/natural-earth-vector@master/geojson/ne_50m_admin_0_countries.geojson',
  'https://cdn.jsdelivr.net/gh/nvkelso/natural-earth-vector@master/geojson/ne_110m_admin_0_countries.geojson'];
const ALIAS={SDS:'SSD',KOS:'XKX'}; // Natural Earth codes that differ from ISO
// Work out which of our countries a border shape belongs to, using its ISO code.
function isoOf(p){for(const k of['ISO_A3_EH','ISO_A3','ADM0_A3']){let v=p[k];if(v&&v!=='-99'){v=ALIAS[v]||v;if(ISO2[v])return v}}return null}
// Area-weighted centre of a ring, used to find the middle of a country's largest landmass.
function ringCentre(r){let a=0,x=0,y=0;
  for(let i=0;i<r.length-1;i++){const c=r[i][0]*r[i+1][1]-r[i+1][0]*r[i][1];a+=c;x+=(r[i][0]+r[i+1][0])*c;y+=(r[i][1]+r[i+1][1])*c}
  a/=2;return a?{area:Math.abs(a),lng:x/(6*a),lat:y/(6*a)}:null}
// Centre of a country = centre of its biggest landmass. Used to place the lock icon.
function centreOf(g){let best=null;
  for(const poly of g.type==='Polygon'?[g.coordinates]:g.coordinates){const c=ringCentre(poly[0]);if(c&&(!best||c.area>best.area))best=c}
  return best}
// Create the guess map, hook up clicks, add a lock icon for every country, then load the borders.
function initGuessMap(){
  gm=new google.maps.Map($('#gmap'),{center:{lat:20,lng:0},zoom:1,minZoom:1,mapTypeControl:false,streetViewControl:false,fullscreenControl:false,clickableIcons:false,gestureHandling:'greedy',draggableCursor:'crosshair'});
  new ResizeObserver(()=>google.maps.event.trigger(gm,'resize')).observe($('#gmap'));
  gm.addListener('click',onMapClick);
  gm.data.addListener('click',onMapClick);
  // One lock per country. They start at a rough position and move to the true centre once borders load.
  for(const c of COUNTRIES)locks[c.cc]=new google.maps.Marker({position:{lat:c.la,lng:c.ln},clickable:false,zIndex:5,icon:{path:google.maps.SymbolPath.CIRCLE,scale:0},label:{text:'🔒',fontSize:'15px'}});
  styleLocks();
  loadBorders();
}
// Download the borders, skip Antarctica, move each lock to its country's centre and draw the shapes on the map.
async function loadBorders(){
  let j=null;
  for(const u of GEO_URLS){try{const r=await fetch(u);if(r.ok){j=await r.json();break}}catch(e){}}
  if(!j){toast('Could not load country borders, so locked countries will not be greyed out.');return}
  const seen=new Set(),best={},feats=[];
  for(const ft of j.features){
    const p=ft.properties||{};
    if(p.ADM0_A3==='ATA'||p.ISO_A3==='ATA')continue; // Antarctica reaches the pole and would cover the whole map
    const iso=isoOf(p);
    if(iso&&!seen.has(iso)){seen.add(iso);ft.id=iso;
      const cc=ISO2[iso],c=centreOf(ft.geometry);
      if(c&&locks[cc]&&(!best[cc]||c.area>best[cc].area)){best[cc]=c;locks[cc].setPosition({lat:c.lat,lng:c.lng})}}
    else delete ft.id;
    p.name=p.NAME||p.ADMIN||'This area';ft.properties=p;feats.push(ft)}
  j.features=feats;gm.data.addGeoJson(j);styleLocks();
}
// Grey out every country that cannot be guessed and put a lock on it.
function styleLocks(){
  if(!gm)return;
  gm.data.setStyle(f=>{const cc=ISO2[f.getId()];
    return cc&&isUnlocked(cc)?{fillColor:'#ffffff',fillOpacity:0.01,strokeColor:'#2f6f7e',strokeOpacity:.4,strokeWeight:1,clickable:true}
      :{fillColor:'#5b6670',fillOpacity:.65,strokeColor:'#3a4854',strokeWeight:1,clickable:true}});
  for(const cc in locks)locks[cc].setMap(isUnlocked(cc)?null:gm);
}
// Player clicked the guess map. A locked or non-game country is rejected straight away. Otherwise the country is
// confirmed with OpenStreetMap and the guess pin is placed.
async function onMapClick(e){
  if(S.complete||S.busy||!S.actual||$('#result').style.display==='block')return;
  const reset=()=>{$('#guessBtn').textContent=S.guess?'Guess':'Place a guess'};
  let poly=null; // country taken from the clicked border shape
  if(e.feature){
    const cc=ISO2[e.feature.getId()],n=e.feature.getProperty('name');
    if(!cc){toast(`${n} is not part of this game.`);return}
    if(!isUnlocked(cc)){toast(`🔒 ${n} is locked. Find its item in the multiworld first.`);return}
    poly={cc,name:CC[cc].name};
  }
  S.busy=true;$('#guessBtn').textContent='Checking country…';
  const lat=e.latLng.lat(),lng=((e.latLng.lng()+540)%360)-180;
  let g=await reverse(lat,lng); // more precise near borders than the simplified shapes
  S.busy=false;
  if(!g&&poly)g=poly;
  if(!g){toast('Pick a spot on land.');reset();return}
  if(!CC[g.cc]){toast(`${g.name} is not part of this game.`);reset();return}
  if(!isUnlocked(g.cc)){
    toast(`🔒 ${g.name} is locked. Find its item in the multiworld first.`);reset();return}
  S.guess={lat,lng,cc:g.cc,name:g.name};
  if(gMarker)gMarker.setPosition({lat,lng});else gMarker=new google.maps.Marker({position:{lat,lng},map:gm});
  $('#guessBtn').disabled=false;$('#guessBtn').textContent=`Guess in ${g.name}`;
}

// ROUNDS (choosing a location, scoring)
// ---------- Rounds ----------
// Official Google coverage only: the copyright credits Google and the pano ID is the 22-character
// kind (user-contributed photospheres have a contributor credit and much longer IDs).
const isOfficial=d=>/google/i.test(d.copyright||'')&&String(d.location.pano).length===22;
// Ask Google for the nearest official Street View photo within `radius` metres of a point (default 50 km).
const findPano=(la,ln,radius=50000)=>new Promise(res=>svs.getPanorama({location:{lat:la,lng:ln},radius,source:google.maps.StreetViewSource.OUTDOOR},
  (d,st)=>res(st==='OK'&&isOfficial(d)?d:null)));
// Variety: every spawn area is used once before any repeats, the same country is not picked twice
// in a row, and places seen recently (kept between sessions) are skipped.
const SMALL=new Set(['sg','be','nl','ch','at','ie','ee','lv','lt','sk','il','jo','ae','lk','tw','hr','dk','pt','cz','rs','bg','hu']);
// Memory used to avoid repeats and to learn which countries have coverage (all saved in the browser):
// seen = places already shown, bad = cities with no coverage, cstat = hits/misses per country.
let lastCc=null,seen=[],bad=new Set(),cstat={};
try{cstat=JSON.parse(localStorage.getItem('apgeo_cc')||'{}')}catch(e){}
// Countries I expect to have official coverage; the rest are explored automatically.
const KNOWN=new Set(SPAWN.map(c=>c.cc)); // countries expected to have official coverage
// Record whether a country gave us a Street View photo (hit) or not (miss).
function note(cc,hit){const t=cstat[cc]||(cstat[cc]={hit:0,miss:0});if(hit){t.hit++;t.miss=0}else t.miss++;
  try{localStorage.setItem('apgeo_cc',JSON.stringify(cstat))}catch(e){}}
// A country with no hit after several tries is treated as having no official coverage.
const isDead=cc=>{const t=cstat[cc];return !!t&&t.hit===0&&t.miss>=(KNOWN.has(cc)?25:8)};
try{seen=JSON.parse(localStorage.getItem('apgeo_seen')||'[]')}catch(e){}
try{bad=new Set(JSON.parse(localStorage.getItem('apgeo_bad')||'[]'))}catch(e){}
// Key for a place (rounded latitude,longitude) so bad places can be remembered.
const keyOf=c=>c.la.toFixed(2)+','+c.ln.toFixed(2);
// Remember that a city has no official coverage so it is not tried again.
function markBad(c){bad.add(keyOf(c));try{localStorage.setItem('apgeo_bad',JSON.stringify([...bad].slice(-8000)))}catch(e){}}
// Spawn areas are grouped by country. A country is picked with weight sqrt(areas) so countries with
// thousands of cities do not drown out the rest, then its areas are dealt from a shuffled bag.
// Spawn areas grouped by country, and a shuffled 'bag' per country so every area is used once before any repeats.
const byCc={},bags={};
// Rebuild the per-country groups after SPAWN changes.
function indexSpawn(){for(const k in byCc)delete byCc[k];for(const k in bags)delete bags[k];
  for(const c of SPAWN)(byCc[c.cc]||(byCc[c.cc]=[])).push(c)}
// Pick a country (not the same one twice in a row, skipping countries found to have no coverage), then deal one
// of its areas from the bag.
function pickArea(){
  let ccs=Object.keys(byCc).filter(k=>!isDead(k));if(!ccs.length)ccs=Object.keys(byCc);
  if(ccs.length>1)ccs=ccs.filter(k=>k!==lastCc);
  // countries not yet proven to have coverage are explored, but less often
  const w=ccs.map(k=>Math.sqrt(byCc[k].length)*(KNOWN.has(k)||(cstat[k]&&cstat[k].hit)?1:0.2));let r=Math.random()*w.reduce((a,b)=>a+b,0),cc=ccs[0];
  for(let i=0;i<ccs.length;i++){r-=w[i];if(r<=0){cc=ccs[i];break}}
  let b=bags[cc];
  if(!b||!b.length){b=bags[cc]=byCc[cc].slice();
    // Weighted shuffle: a town's chance of coming up early rises gently with its population
    // (a 1 million town is about 2.5x as likely as a 10,000 town). The last item is dealt first.
    for(const c of b)c.k=Math.pow(Math.random(),1/Math.pow((c.pop||300000)+1000,0.2));
    b.sort((x,y)=>x.k-y.k)}
  return b.pop()}
// Same as pickArea() but skips cities already known to have no coverage.
function nextSpawn(){let c,n=0;do{c=pickArea()}while(c.city&&bad.has(keyOf(c))&&++n<80);return c}
// Thousands of extra areas: every populated place in every country. Countries with no Street View
// are found out by trying and then dropped; the result is remembered in the browser.
// List of world populated places (Natural Earth) used as extra spawn areas.
const CITY_URLS=['https://cdn.jsdelivr.net/gh/nvkelso/natural-earth-vector@master/geojson/ne_10m_populated_places_simple.geojson',
  'https://cdn.jsdelivr.net/gh/nvkelso/natural-earth-vector@master/geojson/ne_50m_populated_places_simple.geojson'];
// Download the populated places and add each one in our countries to SPAWN.
async function loadCities(){
  let j=null;
  for(const u of CITY_URLS){try{const r=await fetch(u);if(r.ok){j=await r.json();break}}catch(e){}}
  if(!j)return;
  let n=0;
  for(const f of j.features){
    const p=f.properties||{},g=f.geometry;if(!g||!g.coordinates)continue;
    const cc=ISO2[ALIAS[p.adm0_a3]||p.adm0_a3]||(p.iso_a2?String(p.iso_a2).toLowerCase():null);
    if(!cc||!CC[cc])continue;
    const pop=p.pop_max||p.pop_min||0;
    if(pop&&pop<5000&&!p.adm0cap)continue; // skip tiny villages: more likely to be remote
    SPAWN.push({cc,la:g.coordinates[1],ln:g.coordinates[0],city:true,pop});n++}
  if(n>0)for(let i=SPAWN.length-1;i>=0;i--)if(SPAWN[i].rough)SPAWN.splice(i,1); // towns replace the rough anchors
  indexSpawn();
}
indexSpawn();
// True if this photo, or any place within 15 km of the last 80 shown, was already used.
const seenNearby=(id,la,ln)=>seen.some(x=>x.id===id)||seen.slice(-80).some(x=>km(x.la,x.ln,la,ln)<15);
// Add a place to the 'seen' list (kept to the last 600) and save it.
function remember(id,la,ln){seen.push({id,la,ln});if(seen.length>600)seen.shift();try{localStorage.setItem('apgeo_seen',JSON.stringify(seen))}catch(e){}}
// Start a round: clear the last one, then try up to 40 random spots until an official, unseen Street View is
// found. Then show it and work out the true country of that spot.
async function newRound(){
  if(S.complete)return; // goal reached: no more rounds
  $('#result').style.display='none';$('#dim').style.display='none';$('#start').style.display='none';$('#loading').style.display='flex';
  S.used.clear();S.hints=[];renderHints(); // powers work for one round only
  $('#gwrap').classList.remove('big');$('#gwrap').style.display='flex';
  for(const o of[gMarker,aMarker,gLine])if(o)o.setMap(null);gMarker=aMarker=gLine=null;
  gm.setZoom(1);gm.setCenter({lat:20,lng:0});S.guess=null;S.actual=null;
  const b=$('#guessBtn');b.disabled=true;b.textContent='Place a guess';
  for(let t=0;t<40;t++){
    // Pick a start area (a town) and move it a short random distance for variety.
    const c=nextSpawn(),j=c.rough?0.6:c.city?0.07:SMALL.has(c.cc)?0.08:0.1; // about 8 km for towns
    const rad=c.rough?50000:c.city?8000:12000;    // how far Google may look for a photo
    const la=c.la+(Math.random()*2-1)*j,ln=c.ln+(Math.random()*2-1)*j;
    const d=await findPano(la,ln,rad);if(!d){note(c.cc,false);if(c.city)markBad(c);continue}
    note(c.cc,true);
    const p=d.location.latLng,id=d.location.pano;
    if(!c.rough&&km(c.la,c.ln,p.lat(),p.lng())>15)continue; // too far from the town: skip
    if(seenNearby(id,p.lat(),p.lng()))continue; // skip places shown recently
    remember(id,p.lat(),p.lng());lastCc=c.cc;
    S.actual={lat:p.lat(),lng:p.lng(),cc:c.cc,name:CC[c.cc].name};
    pano.setPano(id);pano.setVisible(true);
    break;
  }
  if(!S.actual){toast('Could not find official Street View imagery. Check your API key and connection.');$('#loading').style.display='none';return}
  S.round++;render();
  const t=await reverse(S.actual.lat,S.actual.lng); // true country of the spot
  if(t&&t.cc){S.actual.cc=t.cc;S.actual.name=t.name}
  $('#loading').style.display='none';
  updatePowers(); // the round is ready: powers become usable
}
// Player pressed Guess: score it, send the matching checks, show the score pop-up and draw the guess, the real spot and a dashed line on the map.
function submit(){
  if(S.complete||!S.guess||!S.actual)return;
  const a=S.actual,g=S.guess;
  // Distance and score decide which bracket's check is sent; a correct country also sends a Correct Country check.
  const d=km(a.lat,a.lng,g.lat,g.lng),sc=scoreOf(d);
  const br=BR.find(x=>sc>=x.lo&&sc<=x.hi);
  const out=[];
  {
    // A check is only sent if its group is open. Locked groups show a reminder of the item that opens them.
    if(isGateLocked(br.k))out.push(`🔒 ${br.k} checks are locked. Find the ${br.k} Unlock item.`);
    else{const n=award(br.k);
      out.push(n?`✔ Sent <span class="chk">${n}</span> (+${VAL[br.k]} PP)`:S.online?`No free ${br.k} checks left`:'')}
    if(g.cc===a.cc){
      if(isGateLocked('country'))out.push('🔒 Correct Country checks are locked. Find the Correct Country Unlock item.');
      else{const n2=award('country');out.push(n2?`✔ Sent <span class="chk">${n2}</span> (+${VAL.country} PP)`:'No country checks left')}}
  }
  const ok=g.cc===a.cc;
  const r=$('#result');
  r.innerHTML=`<h2>${sc} points</h2><p>${Math.round(d).toLocaleString()} km away. It was in <b>${a.name}</b>${ok?' ✔':', you guessed '+g.name+'.'}</p>${out.filter(Boolean).map(x=>`<p>${x}</p>`).join('')}<p><button class="btn" id="nextBtn">Next round</button></p>`;
  r.style.display='block';$('#dim').style.display='block';$('#nextBtn').onclick=newRound;
  $('#gwrap').classList.add('big');$('#guessBtn').disabled=true;
  aMarker=new google.maps.Marker({position:{lat:a.lat,lng:a.lng},map:gm,zIndex:10,icon:{path:google.maps.SymbolPath.CIRCLE,scale:9,fillColor:'#e8a33d',fillOpacity:1,strokeColor:'#fff',strokeWeight:2}});
  gLine=new google.maps.Polyline({map:gm,path:[{lat:g.lat,lng:g.lng},{lat:a.lat,lng:a.lng}],strokeOpacity:0,
    icons:[{icon:{path:'M 0,-1 0,1',strokeColor:'#d9604c',strokeOpacity:1,scale:3},offset:'0',repeat:'12px'}]});
  setTimeout(()=>{const bd=new google.maps.LatLngBounds();bd.extend({lat:a.lat,lng:a.lng});bd.extend({lat:g.lat,lng:g.lng});gm.fitBounds(bd,70)},250);
  render();
}

// START-UP
// ---------- Boot ----------
// Load the Google Maps script (once) using the key above.
function loadGoogle(key){return new Promise((res,rej)=>{
  if(window.google&&google.maps)return res();
  window.gm_authFailure=()=>toast('Google Maps rejected the API key.');
  const s=document.createElement('script');s.src=`https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(key)}`;
  s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
// Compass: the dial turns opposite to the view so N always points at true north.
function buildCompass(){
  let h='';
  for(let a=0;a<360;a+=15){const major=a%90===0,r1=major?30:a%45===0?36:40;
    h+=`<line x1="0" y1="-44" x2="0" y2="-${r1+ (major?8:0)}" stroke="#efe6d2" stroke-opacity="${a%45===0?.9:.45}" stroke-width="${a%45===0?1.6:1}" transform="rotate(${a})"/>`}
  [['N',0,'#d9604c'],['E',90,'#efe6d2'],['S',180,'#efe6d2'],['W',270,'#efe6d2']].forEach(([t,a,c])=>{
    h+=`<g transform="rotate(${a})"><text y="-24" text-anchor="middle" font-size="13" font-weight="700" fill="${c}" font-family="Georgia,serif" transform="rotate(${-a} 0 -24)">${t}</text></g>`});
  $('#dial').innerHTML=h;
}
// Turn the dial to match where the player is looking.
function updateCompass(){$('#dial').setAttribute('transform',`rotate(${-(pano.getPov().heading||0)})`)}
// Start playing button: needs a connection and Google Maps, creates the Street View viewer and compass on first use, then starts round 1.
async function begin(){
  if(S.complete)return;
  if(!S.online){$('#modal').classList.remove('hide');$('#msg').textContent='Connect to your multiworld first.';return}
  if(!await S.gready){toast('Google Maps failed to load. Check your API key and internet connection.');return}
  if(!pano){svs=new google.maps.StreetViewService();
    pano=new google.maps.StreetViewPanorama($('#pano'),{addressControl:false,showRoadLabels:false,fullscreenControl:false,enableCloseButton:false});
    buildCompass();pano.addListener('pov_changed',updateCompass);pano.addListener('pano_changed',updateCompass);$('#compass').style.display='block'}
  render();newRound();
}
// When the page loads: restore saved server/slot, start loading Google Maps and the city list, and hook up all the buttons.
window.addEventListener('DOMContentLoaded',()=>{
  const s=getSaved();for(const k of['server','slot'])if(s[k])$('#'+k).value=s[k];
  S.gready=loadGoogle(GMAPS_KEY).then(()=>{initGuessMap();return true}).catch(()=>false);
  render();loadCities();
  $('#homeLink').href=HOME_URL;
  buildPowers();
  // Guess map: it grows while the mouse is over it and shrinks 2 seconds after the mouse leaves.
  const gw=$('#gwrap');let shrinkTimer=null;
  gw.addEventListener('pointerenter',()=>{clearTimeout(shrinkTimer);gw.classList.add('hov')});
  gw.addEventListener('pointerleave',()=>{clearTimeout(shrinkTimer);shrinkTimer=setTimeout(()=>gw.classList.remove('hov'),2000)});
  // Collapse button on the text client. The last choice is remembered between visits.
  let chatMin=false;try{chatMin=localStorage.getItem('apgeo_chatmin')==='1'}catch(e){}
  setChatMin(chatMin);
  $('#chatToggle').onclick=()=>setChatMin(!$('#chat').classList.contains('min'));
  // Text client input: Enter sends what you typed to the server as chat (a message starting with ! is a server command).
  $('#chatIn').addEventListener('keydown',e=>{
    e.stopPropagation(); // keep typing from triggering Street View key controls
    if(e.key!=='Enter')return;
    const t=e.target.value.trim();if(t&&S.online)send({cmd:'Say',text:t});
    e.target.value='';});
  $('#connectBtn').onclick=connect;
  $('#closeBtn').onclick=()=>$('#modal').classList.add('hide');
  $('#settingsBtn').onclick=()=>$('#modal').classList.remove('hide');
  $('#startBtn').onclick=begin;
  $('#guessBtn').onclick=submit;
});
</script>
</body>
